name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Accept Android SDK license
        run: |
          sed -i.bak "s/# android.accept_sdk_license = False/android.accept_sdk_license = True/" buildozer.spec
          sed -i.bak "s/#p4a.branch = master/p4a.branch = develop/" buildozer.spec

      -      - name: Prepare Android tools
        run: |
          buildozer android p4a -- --help

      - name: Install Android Build Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/tools/bin/sdkmanager"

          echo "Installing Android Build Tools..."

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools" "build-tools;35.0.0"

          echo "Checking AIDL..."
          ls -l "$SDK/build-tools/35.0.0/aidl"
          "$SDK/build-tools/35.0.0/aidl" --help

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VVDDA-Translator-APK
          path: bin/*.apk
